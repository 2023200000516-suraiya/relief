
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Flood Relief Management</title>

    <link rel="stylesheet" th:href="@{/login.css}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Flood Relief Management</h1>

        <h2>Login</h2>


        <!-- Error Message -->

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>


        <!-- Login Form -->

        <form action="/login" method="post">

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>


            <label for="role">
                Select Role
            </label>

            <select id="role"
                    name="role"
                    required>

                <option value="">
                    Select your role
                </option>

                <option value="ADMIN">
                    Admin
                </option>

                <option value="VOLUNTEER">
                    Volunteer
                </option>

                <option value="VICTIM">
                    Victim
                </option>

            </select>


            <button type="submit">
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="/register">
                Register here
            </a>
        </p>

    </div>

</div>

</body>

</html>
